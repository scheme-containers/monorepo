name: wile

on:
  workflow_dispatch:
  push:
    paths:
      - implementations/wile/**/Dockerfile*
      - implementations/wile/**/checksum
      - .github/workflows/wile*.yml
jobs:
  latest:
    strategy:
      fail-fast: false
      matrix:
        linux: [debian, alpine]
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        version: [latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build wile
        if: github.ref != 'refs/heads/master'
        run: make VERSION=${{ matrix.version }} SCHEME=wile LINUX=${{ matrix.linux }} build
      - name: Login to DockerHub
        if: github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push wile
        if: github.ref == 'refs/heads/master'
        run: make VERSION=${{ matrix.version }} SCHEME=wile LINUX=${{ matrix.linux }} build push
