name: Weekly heads

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 2"
  push:
    paths:
      - .github/workflows/weekly-heads.yml
jobs:
  heads:
    strategy:
      fail-fast: false
      matrix:
        scheme: [capyscheme, gambit, guile, goldfish, lips, meevax, wile]
        version: [head]
        linux: [debian]
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build ${{ matrix.scheme }}
        if: github.ref != 'refs/heads/master'
        run: make VERSION=latest SCHEME=${{ matrix.scheme }} LINUX=${{ matrix.linux }} build
      - name: Login to DockerHub
        if: github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push ${{ matrix.scheme }}
        if: github.ref == 'refs/heads/master'
        run: make VERSION=${{ matrix.version }} SCHEME=${{ matrix.scheme }} LINUX=${{ matrix.linux }} build push
