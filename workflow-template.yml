name: ${SCHEME}

on:
  workflow_dispatch:
  push:
    paths:
      - implementations/${SCHEME}/**/Dockerfile*
      - implementations/${SCHEME}/**/checksum
      - .github/workflows/${SCHEME}*.yml
jobs:
  latest:
    strategy:
      fail-fast: false
      matrix:
        linux: [${WORKFLOW_LINUX}]
        os: [${WORKFLOW_OS}]
        version: [latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build ${SCHEME}
        if: github.ref != 'refs/heads/master'
        run: make VERSION=${{ matrix.version }} SCHEME=${SCHEME} LINUX=${{ matrix.linux }} build
      - name: Login to DockerHub
        if: github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push ${SCHEME}
        if: github.ref == 'refs/heads/master'
        run: make VERSION=${{ matrix.version }} SCHEME=${SCHEME} LINUX=${{ matrix.linux }} build push
